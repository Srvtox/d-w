name: Debug SSH Runner

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 65   # یکم بیشتر از ۱ ساعت برای احتیاط

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Start SSH session (tmate)
        uses: mxschmitt/action-tmate@v3

      - name: Keep runner alive for 1 hour
        run: |
          echo "🚀 SSH session is active."
          echo "⏳ Keeping runner alive for 1 hour..."

          START=$(date +%s)
          END=$((START + 3600))

          while [ $(date +%s) -lt $END ]; do
            NOW=$(date +%s)
            REMAIN=$((END - NOW))
            echo "⏱ Remaining: $REMAIN seconds"
            sleep 60
          done

          echo "✅ 1 hour finished. Exiting..."
