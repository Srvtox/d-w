name: Tunnel Test

on:
  push:

jobs:
  tunnel:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Start local server
        run: |
          nohup python3 -m http.server 8080 &

      - name: Create tunnel
        uses: codetalkio/expose-tunnel@v1.5.0
        id: expose
        with:
          service: bore.pub
          port: 8080

      - name: Print tunnel URL
        run: echo "Tunnel URL: ${{ steps.expose.outputs['tunnel-url'] }}"

      - name: Keep tunnel alive
        run: timeout 30m sleep 7200
