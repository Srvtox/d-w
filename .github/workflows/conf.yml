name: V2Ray Auto Checker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y curl jq coreutils

      - name: Prepare folders
        run: |
          mkdir -p data
          mkdir -p output
          rm -f output/working.txt

      - name: Download subscriptions
        run: |
          curl -L https://raw.githubusercontent.com/mfuu/v2ray/master/v2ray > data/sub1.txt
          curl -L https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt > data/sub2.txt

      - name: Decode subscriptions
        run: |
          cat data/*.txt | base64 -d > data/all.txt || true
          cat data/*.txt >> data/all.txt

      - name: Filter protocols
        run: |
          grep -E "vmess://|vless://|trojan://|ss://" data/all.txt > data/protocols.txt || true

      - name: Check connectivity
        run: |
          while read line; do
            host=$(echo $line | sed -E 's#(vmess|vless|trojan|ss)://([^@]+@)?([^:/]+).*#\3#')
            if [ ! -z "$host" ]; then
              ping -c1 -W1 $host >/dev/null 2>&1
              if [ $? -eq 0 ]; then
                echo $line >> output/working.txt
              fi
            fi
          done < data/protocols.txt

      - name: Remove duplicates
        run: |
          sort -u output/working.txt -o output/working.txt

      - name: Encode final subscription
        run: |
          base64 -w0 output/working.txt > output/subscription.txt

      - name: Commit results
        run: |
          git config --global user.name "actions-bot"
          git config --global user.email "actions@github.com"
          git add output/*
          git commit -m "update working v2ray configs" || echo "No changes"
          git push
