name: V2Ray Auto Collector

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y curl coreutils

      - name: Prepare folders
        run: |
          mkdir -p data
          mkdir -p output
          rm -f data/*
          rm -f output/*

      - name: Download config sources
        run: |
          curl -L https://raw.githubusercontent.com/mfuu/v2ray/master/v2ray -o data/sub1.txt || true
          curl -L https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt -o data/sub2.txt || true
          curl -L https://raw.githubusercontent.com/SoliSpirit/v2ray-configs/main/all_configs.txt -o data/sub3.txt || true
          curl -L https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/v2ray.txt -o data/sub4.txt || true

      - name: Decode subscriptions
        run: |
          touch data/all.txt

          for f in data/*.txt
          do
            base64 -d "$f" > data/tmp.txt 2>/dev/null || cat "$f" > data/tmp.txt
            cat data/tmp.txt >> data/all.txt
          done

          rm -f data/tmp.txt

      - name: Extract protocols
        run: |
          grep -Eo '(vmess|vless|trojan|ss)://[^ ]+' data/all.txt > data/protocols.txt || true
          sort -u data/protocols.txt -o data/protocols.txt || true

      - name: Test TCP connectivity
        run: |
          touch output/working.txt

          while IFS= read -r line
          do
            host=$(echo "$line" | sed -E 's#(vmess|vless|trojan|ss)://([^@]+@)?([^:/]+).*#\3#')
            port=$(echo "$line" | grep -oE ':[0-9]+' | head -n1 | tr -d ':')

            if [ -z "$port" ]; then
              port=443
            fi

            if [ -n "$host" ]; then
              timeout 3 bash -c "cat < /dev/null > /dev/tcp/$host/$port" 2>/dev/null && echo "$line" >> output/working.txt || true
            fi

          done < data/protocols.txt || true

      - name: Remove duplicates
        run: |
          sort -u output/working.txt -o output/working.txt || true

      - name: Create subscription
        run: |
          base64 -w0 output/working.txt > output/subscription.txt || true

      - name: Commit results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add output/* || true
          git commit -m "Auto update configs" || echo "No changes"
          git push || true
