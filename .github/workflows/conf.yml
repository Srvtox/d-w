name: Create Tunnel

on: [push]

jobs:
  tunnel:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Start Tunnel
      id: tun
      uses: anyvm-org/cf-tunnel@v0
      with:
        protocol: http
        port: 8080

    - name: Show Tunnel URL
      run: echo "Tunnel URL: https://${{ steps.tun.outputs.server }}"
