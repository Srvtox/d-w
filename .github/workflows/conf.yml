name: V2Ray Auto Checker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y curl jq coreutils

      - name: Prepare folders
        run: |
          mkdir -p data
          mkdir -p output
          rm -f output/working.txt

      - name: Download subscriptions
        run: |
          curl -L https://raw.githubusercontent.com/mfuu/v2ray/master/v2ray -o data/sub1.txt
          curl -L https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt -o data/sub2.txt
          curl -L https://raw.githubusercontent.com/SoliSpirit/v2ray-configs/refs/heads/main/all_configs.txt -o data/sub3.txt

      - name: Decode subscriptions safely
        run: |
          rm -f data/all.txt
          touch data/all.txt

          for f in data/*.txt; do
            if [ "$f" = "data/all.txt" ]; then
              continue
            fi

            if base64 -d "$f" > data/tmp.txt 2>/dev/null; then
              cat data/tmp.txt >> data/all.txt
            else
              cat "$f" >> data/all.txt
            fi
          done

          rm -f data/tmp.txt

      - name: Filter protocols
        run: |
          grep -E "vmess://|vless://|trojan://|ss://" data/all.txt > data/protocols.txt || true

      - name: Check connectivity
        run: |
          while read line; do
            host=$(echo $line | sed -E 's#(vmess|vless|trojan|ss)://([^@]+@)?([^:/]+).*#\3#')
            if [ ! -z "$host" ]; then
              ping -c1 -W1 $host >/dev/null 2>&1
              if [ $? -eq 0 ]; then
                echo $line >> output/working.txt
              fi
            fi
          done < data/protocols.txt

      - name: Remove duplicates
        run: |
          sort -u output/working.txt -o output/working.txt

      - name: Encode final subscription
        run: |
          base64 -w0 output/working.txt > output/subscription.txt

      - name: Commit results
        run: |
          git config --global user.name "actions-bot"
          git config --global user.email "actions@github.com"
          git add output/*
          git commit -m "update working v2ray configs" || echo "No changes"
          git push
